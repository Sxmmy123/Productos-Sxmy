    <header class="store-header">
        <nav class="store-nav">
            <button id="storeSidebarToggle" data-sidebar-toggle aria-controls="appSidebar" class="hamburger-button" type="button" title="Abrir menu" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        <div class="store-search">
            <input id="search" class="form-field" placeholder="Buscar producto o codigo">
        </div>
        <div class="store-actions">
            <button id="cartToggle" class="cart-toggle hidden" type="button" title="Ver carrito">
                <span class="cart-icon" aria-hidden="true"></span>
                <span>Carrito</span>
                <strong id="cartBadge">0</strong>
            </button>
        </div>
        </nav>
    </header>

    <div class="store-main">
    <div class="order-state"><span id="connectionStatus" role="status"></span><span id="draftStatus" role="status"></span></div>
    <div id="storeStatusBox" class="hidden mb-4 rounded-lg border border-[#d8e0e4] bg-white px-4 py-3 text-sm text-[#52616b]" role="status"></div>

    <section class="store-filterbar" aria-label="Filtros de catalogo">
        <div id="storeAlphabetFilters" class="store-filter-scroll">
            <button class="store-filter-chip active" data-store-filter="all" type="button">Todos</button>
        </div>
        <span id="visibleProductCount" class="store-count-inline">Cargando...</span>
    </section>

    <section id="grid" class="product-grid" aria-busy="true" aria-label="Cargando productos">
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
    </section>

    <section id="adminCheckout" class="checkout-panel hidden">
        <div class="checkout-head">
            <div>
                <p class="eyebrow">Venta</p>
                <h2>Carrito</h2>
                <p id="saleMode">La venta se guardara en Historial.</p>
            </div>
            <button id="checkoutClose" class="icon-button" type="button" title="Cerrar">X</button>
        </div>
        <div class="checkout-body">
            <ul id="cartList" class="checkout-list"></ul>
            <div>
                <label class="text-sm font-semibold text-[#374151]" for="discountAmount">Descuento Bs</label>
                <input id="discountAmount" type="number" min="0" step="0.01" class="form-field mt-1" placeholder="0">
            </div>
            <div class="checkout-total">
                <span>Total</span>
                <strong><span id="total">0</span> Bs</strong>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button id="openSaleModal" class="btn-primary px-4 py-2.5 text-sm" type="button">Nota de venta</button>
                <button id="clearCart" class="btn-light px-4 py-2.5 text-sm" type="button">Cancelar orden</button>
            </div>
            <div class="grid grid-cols-1 gap-2">
                <button id="printLastSale" class="btn-light px-4 py-2.5 text-sm" type="button" disabled>Imprimir</button>
            </div>
            <div id="saleStatus" class="sale-status" role="status"></div>
        </div>
    </section>
    <div id="mobileCheckoutBar" class="mobile-checkout-bar" hidden>
        <div><span>Total</span><strong id="mobileCartTotal">0 Bs</strong></div>
        <button id="mobileCreateNote" class="btn-primary" type="button">Nota de venta</button>
    </div>
    </div>
<div id="saleModal" class="sale-modal hidden">
    <section class="sale-modal-card" role="dialog" aria-modal="true" aria-labelledby="saleModalTitle">
        <div class="sale-modal-head">
            <div>
                <p class="eyebrow">Datos opcionales</p>
                <h2 id="saleModalTitle">Nota de venta</h2>
            </div>
            <button id="saleModalClose" class="icon-button" type="button" title="Cerrar">X</button>
        </div>
        <div class="sale-modal-body">
            <div>
                <label class="text-sm font-semibold text-[#374151]" for="customerName">Cliente</label>
                <input id="customerName" class="form-field mt-1" placeholder="Sin nombre">
            </div>
            <div>
                <label class="text-sm font-semibold text-[#374151]" for="customerPhone">Telefono</label>
                <input id="customerPhone" type="tel" class="form-field mt-1" placeholder="Opcional">
            </div>
            <div>
                <label class="text-sm font-semibold text-[#374151]" for="customerAddress">Direccion</label>
                <input id="customerAddress" class="form-field mt-1" placeholder="Opcional">
            </div>
            <div>
                <label class="text-sm font-semibold text-[#374151]" for="paymentMethod">Pago</label>
                <select id="paymentMethod" class="form-field mt-1">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
            </div>
        </div>
        <p id="saleModalStatus" class="form-message" role="status"></p>
        <div class="sale-modal-actions">
            <button id="saveSale" class="btn-primary px-4 py-2.5 text-sm" type="button">Crear nota</button>
            <button id="cancelOrder" class="btn-light px-4 py-2.5 text-sm" type="button">Cancelar orden</button>
        </div>
    </section>
</div>

<div id="salePreviewModal" class="sale-modal hidden">
    <section class="sale-modal-card sale-preview-card">
        <div class="sale-modal-head">
            <div>
                <p class="eyebrow">Revision final</p>
                <h2>Nota lista</h2>
            </div>
            <button id="salePreviewClose" class="icon-button" type="button" title="Cerrar">X</button>
        </div>
        <div id="salePreviewContent" class="sale-preview-body"></div>
        <div class="sale-modal-actions">
            <button id="salePreviewPrint" class="btn-primary px-4 py-2.5 text-sm" type="button">Imprimir nota</button>
            <button id="salePreviewDismiss" class="btn-light px-4 py-2.5 text-sm" type="button">Cerrar</button>
        </div>
    </section>
</div>
