<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Productos SXMY">
<title>Cajeros - Inventario SXMY</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/utilities.css?v=1">
<link rel="stylesheet" href="css/admin-compact.css?v=19">
</head>
<body class="min-h-screen bg-[#f5f7f8] text-[#111827]">
<div class="admin-layout">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <div>
                <a href="index.html">PRODUCTOS SXMY</a>
                <span>Panel admin</span>
            </div>
            <button id="sidebarCollapse" class="sidebar-collapse-toggle" type="button" title="Contraer menu" aria-label="Contraer menu">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button id="sidebarClose" class="icon-button sidebar-close" type="button" title="Cerrar">X</button>
        </div>
        <nav class="sidebar-nav">
            <a class="sidebar-link" href="admin.html#productos" title="Productos"><span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg></span><span class="sidebar-copy"><span class="sidebar-text">Productos</span><small>Inventario, precios y stock</small></span></a>
            <a class="sidebar-link" href="admin.html#historial" title="Historial"><span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></span><span class="sidebar-copy"><span class="sidebar-text">Historial</span><small>Notas de venta</small></span></a>
            <a class="sidebar-link" href="admin.html#analisis" title="Analisis"><span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5"/><path d="M13 16V8"/><path d="M18 16v-3"/></svg></span><span class="sidebar-copy"><span class="sidebar-text">Analisis</span><small>Mas vendidos por dia</small></span></a>
            <a class="sidebar-link active" href="admin-users.html" title="Cajeros"><span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg></span><span class="sidebar-copy"><span class="sidebar-text">Cajeros</span><small>Usuarios y ventas</small></span></a>
        </nav>
        <div class="sidebar-actions">
            <button class="theme-toggle theme-toggle-wide" data-theme-toggle type="button">Oscuro</button>
            <a class="sidebar-store" href="index.html" title="Tienda"><span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5"/><path d="M4 9h16v11H4z"/><path d="M9 20v-6h6v6"/></svg></span><span class="sidebar-action-text">Tienda</span></a>
            <button id="logout" class="sidebar-logout" type="button" title="Salir"><span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg></span><span class="sidebar-action-text">Salir</span></button>
        </div>
    </aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <button id="sidebarToggle" class="hamburger-button" type="button" title="Menu"><span></span><span></span><span></span></button>
            <div>
                <h1>Cajeros</h1>
            </div>
            <a class="btn-primary px-4 py-2.5 text-sm" href="index.html">Tienda</a>
        </div>

        <div id="statusBox" class="hidden mb-4 rounded-lg border border-[#cfd9df] bg-white px-4 py-3 text-sm text-[#4b5563]">Cargando...</div>

        <section class="grid gap-4 lg:grid-cols-[380px_1fr]">
            <form id="cashierForm" class="rounded-lg border border-[#cfd9df] bg-white p-4 shadow-sm">
                <h2 class="text-xl font-black text-[#111827]">Crear cajero</h2>
                <p class="mt-1 text-sm text-[#65727c]">El cajero podra entrar, vender, agregar productos e imprimir notas.</p>
                <div class="mt-4 space-y-3">
                    <div>
                        <label class="text-sm font-semibold text-[#374151]" for="cashierName">Nombre</label>
                        <input id="cashierName" class="form-field mt-1" placeholder="Ej. Cajero 1" required>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-[#374151]" for="cashierEmail">Correo</label>
                        <input id="cashierEmail" type="email" class="form-field mt-1" placeholder="cajero@correo.com" required>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-[#374151]" for="cashierPassword">Contraseña</label>
                        <input id="cashierPassword" type="password" minlength="6" class="form-field mt-1" placeholder="Minimo 6 caracteres" required>
                    </div>
                    <button class="btn-primary w-full px-4 py-2.5 text-sm" type="submit">Crear usuario</button>
                </div>
            </form>

            <section>
                <div class="mb-3 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                        <h2 class="text-xl font-black text-[#111827]">Usuarios cajeros</h2>
                        <p id="usersSummary" class="mt-1 text-sm text-[#65727c]">0 cajeros</p>
                    </div>
                    <input id="userSearch" class="form-field sm:w-80" placeholder="Buscar cajero o correo">
                </div>
                <div id="usersList" class="grid gap-3"></div>
            </section>
        </section>
    </main>
</div>

<script type="module" src="js/admin-users.js?v=2"></script>
<script src="js/pwa.js?v=1"></script>
</body>
</html>
