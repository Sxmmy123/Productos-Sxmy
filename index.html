<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="app/core/appearance.js?v=4"></script>
<meta name="theme-color" content="#0a2c59">
<meta name="description" content="Catalogo publico de electronica, robotica y accesorios de Productos SXMY.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Productos SXMY">
<title>Productos SXMY - Catalogo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="app/shared/styles/tokens.css?v=2">
<link rel="stylesheet" href="app/shared/styles/foundation.css?v=5">
<link rel="stylesheet" href="app/shared/styles/utilities.css?v=3">
<link rel="stylesheet" href="app/shared/styles/store.css?v=30">
<link rel="stylesheet" href="app/modules/catalogo/styles.css?v=2">
<link rel="stylesheet" href="app/shared/styles/components.css?v=2">
</head>
<body class="store-page public-store-page min-h-screen bg-[#f5f7f8] text-[#111827]">
<header class="store-header public-store-header">
    <nav class="public-store-nav" aria-label="Navegacion del catalogo">
        <a class="brand-mark" href="index.html" aria-label="Productos SXMY, inicio">
            <img class="brand-logo" src="assets/icons/icon-192.png" alt="" width="40" height="40">
            <span class="brand-copy"><span>Productos SXMY</span><small>Electronica y robotica</small></span>
        </a>
        <div class="store-search">
            <label class="sr-only" for="search">Buscar producto</label>
            <input id="search" class="form-field" type="search" placeholder="Buscar producto o codigo" autocomplete="off">
        </div>
        <div class="public-store-actions">
            <button class="theme-toggle" data-theme-toggle type="button" aria-label="Cambiar tema"></button>
            <a class="public-login" href="login.html" title="Ingresar al panel">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l5 5-5 5M19 12H7M3 3v18"/></svg>
                <span>Ingresar</span>
            </a>
        </div>
    </nav>
</header>

<main class="store-main public-store-main">
    <section class="public-store-heading">
        <div><h1>Productos</h1><p>Electronica, robotica y accesorios para tus proyectos.</p></div>
        <span id="productCount" class="count-pill">Cargando...</span>
    </section>
    <div id="statusBox" class="hidden mb-4 rounded-lg border border-[#d8e0e4] bg-white px-4 py-3 text-sm text-[#52616b]" role="status"></div>
    <section class="store-filterbar" aria-label="Filtrar productos por inicial">
        <div id="storeAlphabetFilters" class="store-filter-scroll"><button class="store-filter-chip active" data-store-filter="all" type="button" aria-pressed="true">Todos</button></div>
        <span id="visibleProductCount" class="store-count-inline">Cargando...</span>
    </section>
    <section id="grid" class="product-grid" aria-busy="true" aria-label="Cargando productos">
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
        <article class="product-card product-skeleton" aria-hidden="true"><div class="product-image-shell skeleton-block"></div><div class="product-card-body"><span class="skeleton-line skeleton-name"></span><span class="skeleton-line skeleton-price"></span><span class="skeleton-line skeleton-short"></span></div></article>
    </section>
</main>

<div id="productDetailModal" class="sale-modal hidden" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <section class="sale-modal-card product-detail-card">
        <div class="sale-modal-head">
            <div><p id="detailCode" class="eyebrow">Producto</p><h2 id="detailName">Detalle</h2></div>
            <button id="productDetailClose" class="icon-button" type="button" title="Cerrar" aria-label="Cerrar detalle">X</button>
        </div>
        <div id="productDetailContent" class="product-detail-body"></div>
    </section>
</div>

<script type="module" src="app/modules/catalogo/controller.js?v=4"></script>
<script type="module" src="app/shared/catalog/layout.js?v=3"></script>
<script src="app/core/pwa-register.js?v=3"></script>
</body>
</html>
