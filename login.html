<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Productos SXMY">
<title>Login - Inventario SXMY</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/utilities.css?v=1">
<link rel="stylesheet" href="css/login.css?v=3">
</head>
<body class="login-page min-h-screen bg-[#d8e1ea] text-[#0b0d10]">
<main class="login-shell">
    <section class="login-panel">
        <div class="login-brand-row">
            <a href="index.html" class="login-brand">
                <img class="login-logo-icon" src="assets/icons/icon.svg" alt="">
                <span>PRODUCTOS SXMY</span>
            </a>
            <button class="theme-toggle" data-theme-toggle type="button">Oscuro</button>
        </div>
        <div class="login-copy">
            <p>Panel autorizado</p>
            <h1>Ingreso al panel</h1>
            <span>Ingresa con tu cuenta de admin o cajero.</span>
        </div>
        <form id="loginForm" class="login-form">
            <div>
                <label for="email">Correo:</label>
                <input id="email" type="email" class="form-field" placeholder="ej. correo@gmail.com" autocomplete="email" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <div class="password-wrap">
                    <input id="password" type="password" class="form-field" autocomplete="current-password" required>
                    <button id="togglePassword" class="password-toggle" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                        <span></span>
                    </button>
                </div>
            </div>
            <label class="remember-row" for="rememberSession">
                <input id="rememberSession" type="checkbox" checked>
                <span>Mantener sesión iniciada</span>
            </label>
            <button class="login-submit" type="submit">Ingresar</button>
            <div id="statusBox" class="login-status" role="status" aria-live="polite"></div>
        </form>
        <p class="login-foot">¿No tienes acceso? Habla con el administrador.</p>
    </section>
</main>
<script type="module" src="js/login.js?v=1"></script>
<script src="js/pwa.js?v=1"></script>
</body>
</html>
